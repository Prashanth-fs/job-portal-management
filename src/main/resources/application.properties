spring.application.name=JOB_Portal_Management_SpringBoot-

# Secrets (DB url, username, password) are NOT stored here.
# They live in application-local.properties, which is ignored by Git.
# Copy application-local.properties.example to application-local.properties and fill it in.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.view.prefix=/WEB-INF/pages/
spring.mvc.view.suffix=.jsp

server.servlet.context-path=/Job_Portal
